[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "score2midi"
version = "0.1.0"
description = "Convert printed score images to MIDI using Audiveris and music21"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["music21>=9.1"]

[project.scripts]
score2midi = "score2midi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

