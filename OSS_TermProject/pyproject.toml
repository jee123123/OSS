[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "score2midi"
version = "0.1.0"
description = "Convert printed score images to MIDI using Audiveris and music21"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "music21>=9.1",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
ml = ["torch>=2.4"]

[project.scripts]
score2midi = "score2midi.cli:main"
score2midi-gui = "score2midi.gui:main"
score2midi-build-dataset = "score2midi.ml_dataset:main"
score2midi-review-dataset = "score2midi.dataset_reviewer:main"
score2midi-train-note-classifier = "score2midi.note_classifier:main"

[tool.setuptools.packages.find]
where = ["src"]

